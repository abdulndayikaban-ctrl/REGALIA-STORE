<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRIP Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:1000;background:#000;border-bottom:1px solid #FFD700;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{color:#FFD700;letter-spacing:2px;font-size:20px}
#cartIcon{position:relative;cursor:pointer;font-size:22px;background:#111;border:1px solid #FFD700;padding:8px 14px;border-radius:20px}
#cartBadge{position:absolute;top:-6px;right:-6px;background:#FFD700;color:#000;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:10px}
#productGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px}
.prod{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer}
.prod img{width:100%;height:180px;object-fit:cover;background:#222}
.prod .info{padding:10px}
.prod .info h3{font-size:14px;margin-bottom:4px}
.prod .info p{color:#FFD700;font-weight:bold}
#loadMore{display:block;margin:20px auto;padding:12px 24px;background:#FFD700;color:#000;border:none;border-radius:20px;font-weight:bold;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:10000;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modalBox{background:#fff;color:#000;width:100%;max-width:420px;border-radius:16px;overflow:hidden;max-height:90vh;overflow:auto}
.color-pill,.size-pill{display:inline-block;padding:6px 12px;border:1px solid #000;border-radius:20px;margin:4px;cursor:pointer;font-size:13px}
.color-pill.active,.size-pill.active{background:#000;color:#FFD700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#FFD700;padding:12px 22px;border-radius:24px;border:1px solid #FFD700;z-index:99999;display:none}
#cartDrawer{position:fixed;top:0;right:-420px;width:400px;max-width:90vw;height:100vh;background:#fff;color:#000;z-index:99999;transition:right .4s;display:flex;flex-direction:column}
#drawerHead{padding:16px;background:#000;color:#FFD700;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<header>
<b>DRIP</b>
<div id="cartIcon" onclick="openCartDrawer()">🛒 <span id="cartBadge">0</span></div>
</header>

<div id="productGrid"></div>
<button id="loadMore">Load More Drip</button>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal" onclick="if(event.target==this)closeModal()">
<div class="modalBox">
<div id="modalBody" style="padding:16px"></div>
<div style="padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid #eee">
<input id="modalQty" type="number" value="1" min="1" style="width:60px;padding:8px;border-radius:8px;border:1px solid #000">
<button id="modalAddBtn" style="flex:1;background:#000;color:#FFD700;border:none;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer">ADD TO DRIP</button>
</div>
</div>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer">
<div id="drawerHead"><b>YOUR DRIP</b><span onclick="closeCartDrawer()" style="cursor:pointer;font-size:22px">✕</span></div>
<div id="drawerItems" style="flex:1;overflow:auto;padding:16px"></div>
<div style="padding:16px;border-top:1px solid #eee">
<div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px"><span>Total</span><span id="drawerTotal">R0</span></div>
<button style="width:100%;background:#FFD700;color:#000;padding:14px;border:none;border-radius:10px;font-weight:bold" onclick="goCheckout()">CHECKOUT</button>
</div>
</div>

<div id="toast"></div>

<script>
const FALLBACK_IMAGE = 'https://via.placeholder.com/400x400?text=DRIP';
let PRODUCTS = [
{id:'1',name:'Drip Hoodie Black',price:450,image:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400',features:'Premium cotton\nGold embroidery\nOversized fit',colors:['Black','White'],sizes:['S','M','L','XL']},
{id:'2',name:'Drip Tee Gold',price:250,image:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400',features:'Soft tee\nStreetwear cut',colors:['Black','Gold','White'],sizes:['M','L','XL']},
{id:'3',name:'Drip Cap',price:180,image:'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400',features:'Adjustable\nEmbroidered logo',colors:['Black'],sizes:['One Size']},
{id:'4',name:'Drip Pants',price:380,image:'https://images.unsplash.com/photo-1516762689617-e1cffcef479d?w=400',features:'Cargo style\nHeavy fabric',colors:['Black','Khaki'],sizes:['30','32','34','36']},
{id:'5',name:'Drip Jacket',price:650,image:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400',features:'Windbreaker\nWater resistant',colors:['Black'],sizes:['M','L','XL']},
{id:'6',name:'Drip Shorts',price:220,image:'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400',features:'Summer drip',colors:['Black','White'],sizes:['S','M','L']}
];
let visibleCount = 4;
let selectedProduct=null,selectedColor='',selectedSize='';

function getCart(){try{return JSON.parse(localStorage.getItem('dripCart')||'[]')}catch(e){return []}}
function saveCart(c){localStorage.setItem('dripCart',JSON.stringify(c))}
function updateCartBadge(){var b=document.getElementById('cartBadge');if(b){b.textContent=getCart().reduce((s,i)=>s+i.qty,0)}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function closeModal(){document.getElementById('productModal').classList.remove('show')}

function renderProducts(){
var grid=document.getElementById('productGrid');
var slice=PRODUCTS.slice(0,visibleCount);
grid.innerHTML=slice.map(p=>`
<div class="prod" onclick="showModalById('${p.id}')">
<img src="${p.image||FALLBACK_IMAGE}" onerror="this.src='${FALLBACK_IMAGE}'">
<div class="info"><h3>${p.name}</h3><p>R${p.price}</p></div>
</div>`).join('');
document.getElementById('loadMore').style.display = visibleCount>=PRODUCTS.length?'none':'block';
updateCartBadge();
}

function showModalById(id){
var p=PRODUCTS.find(x=>x.id==id);
if(p) showModal(p,p.colors||['Black'],p.sizes||['M'])
}

function showModal(product,colors,sizes){
selectedProduct=product;
selectedColor=colors[0]||'';
selectedSize=sizes[0]||'';
const modal=document.getElementById('productModal');
const body=document.getElementById('modalBody');
const features=(product.features||'').split(/\n|\r/).map(x=>x.trim()).filter(Boolean);
body.innerHTML=`
<h2>${product.name}</h2>
<img src="${product.image||FALLBACK_IMAGE}" onerror="this.src='${FALLBACK_IMAGE}'" style="width:100%;height:250px;object-fit:cover;border-radius:12px;margin:10px 0">
<p style="color:#FFD700;font-weight:bold;font-size:18px;margin-bottom:8px">R${product.price}</p>
<div style="margin:10px 0"><b>Color:</b><br>${colors.map(c=>`<span class="color-pill ${c==selectedColor?'active':''}" data-c="${c}">${c}</span>`).join('')}</div>
<div style="margin:10px 0"><b>Size:</b><br>${sizes.map(s=>`<span class="size-pill ${s==selectedSize?'active':''}" data-s="${s}">${s}</span>`).join('')}</div>
<ul style="margin-top:10px;font-size:13px;color:#555">${features.map(f=>`<li>${f}</li>`).join('')}</ul>
`;
modal.classList.add('show');
body.querySelectorAll('.color-pill').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.c;body.querySelectorAll('.color-pill').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
body.querySelectorAll('.size-pill').forEach(b=>b.onclick=()=>{selectedSize=b.dataset.s;body.querySelectorAll('.size-pill').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.getElementById('modalAddBtn').onclick=function(){
const qty=parseInt(document.getElementById('modalQty').value||'1')||1;
const cart=getCart();
const id=(product.id||product.name)+'-'+selectedColor+'-'+selectedSize;
const ex=cart.findIndex(a=>a.id===id);
if(ex>=0){cart[ex].qty+=qty;}else{cart.push({id:id,name:product.name,price:product.price,image:product.image||FALLBACK_IMAGE,color:selectedColor,size:selectedSize,qty:qty})}
saveCart(cart);updateCartBadge();openCartDrawer();toast('Added '+product.name);closeModal();
};
}

function openCartDrawer(){var d=document.getElementById('cartDrawer');if(d){d.style.right='0';}renderDrawer();}
function closeCartDrawer(){var d=document.getElementById('cartDrawer');if(d){d.style.right='-420px';}}
function renderDrawer(){
var c=getCart();var e=document.getElementById('drawerItems');var t=document.getElementById('drawerTotal');
if(!e)return;
if(c.length==0){e.innerHTML='<p style="text-align:center;padding:40px;color:#999">Your drip is empty<br>add some heat 🔥</p>';if(t)t.textContent='R0';return;}
e.innerHTML=c.map(i=>`<div style="display:flex;gap:10px;margin-bottom:14px;border-bottom:1px solid #eee;padding-bottom:10px">
<img src="${i.image||FALLBACK_IMAGE}" style="width:60px;height:60px;object-fit:cover;border-radius:8px">
<div style="flex:1"><b style="font-size:13px">${i.name}</b><div style="font-size:11px;color:#777">${i.color} / ${i.size}</div><div>R${i.price} x ${i.qty}</div></div>
<div style="cursor:pointer" onclick="removeItem('${i.id}')">✕</div>
</div>`).join('');
var total=c.reduce((s,i)=>s+(i.price*i.qty),0);
if(t)t.textContent='R'+total;
}
function removeItem(id){var c=getCart().filter(i=>i.id!==id);saveCart(c);renderDrawer();updateCartBadge();}
function goCheckout(){if(getCart().length==0){toast('Cart empty');return;}window.location.href='checkout.html';}
function loadProducts(){renderProducts();}

document.getElementById('loadMore').addEventListener('click',function(){visibleCount+=4;renderProducts();});
loadProducts();
</script>
</body>
</html>
