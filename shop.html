<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>REGALIA MALL STYLE MALL • BUY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.top-line{height:3px;background:linear-gradient(90deg,#FFD700,#FDB931,#FFD700,#FFE55C,#FFD700);background-size:200% 100%;animation:flow 2.8s linear infinite}
@keyframes flow{0%{background-position:-200% 0}100%{background-position:200% 0}}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
 radial-gradient(130% 90% at 15% 12%, rgba(255,215,0,0.14) 0%, rgba(26,21,0,0.5) 18%, rgba(10,10,10,0) 56%),
 radial-gradient(110% 80% at 85% 85%, rgba(255,215,0,0.10) 0%, rgba(31,26,0,0.42) 20%, rgba(10,10,10,0) 62%),
 linear-gradient(120deg, #0A0A0A 0%, #0f0e08 22%, #1a1500 48%, #111009 78%, #0A0A0A 100%);
 background-size:200% 200%,200% 200%,320% 320%;animation:gradientShift 18s ease-in-out infinite}
@keyframes gradientShift{0%{background-position:0% 50%,100% 50%,0% 50%}50%{background-position:100% 30%,0% 70%,100% 50%}100%{background-position:0% 50%,100% 50%,0% 50%}}
.header{position:sticky;top:0;z-index:30;background:rgba(10,10,10,0.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.1)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo-wrap{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-circle{width:36px;height:36px;border-radius:9999px;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;letter-spacing:0.1em}
.main{max-width:1280px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;border:1px solid rgba(255,255,255,0.1)}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -16px rgba(255,215,0,0.28)}
.card-img{aspect-ratio:1/1;background:#F5F5F5;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.03)}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);border-radius:9999px;padding:6px 10px;font-size:10px;font-weight:700;color:#FFD700}
.card-body{padding:14px}
.card-name{font-size:13px;font-weight:700;color:#000;line-height:1.25;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{margin-top:8px;font-size:16px;font-weight:900;color:#000}
.card-controls{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qty-input{width:50px;padding:6px;border:1px solid #ccc;border-radius:6px;text-align:center}
.size-pill, .color-pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;background:transparent;color:#000;font-size:11px;font-weight:700;cursor:pointer;margin:2px}
.size-pill.active, .color-pill.active{background:#FFD700;border-color:#FFD700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#1a1a1a;border:1px solid rgba(255,255,255,0.2);border-radius:18px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;padding:24px}
.close-btn{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.load-more{text-align:center;padding:24px}
.load-more-btn{padding:12px 28px;background:#FFD700;color:#000;border:none;font-weight:900;letter-spacing:0.1em;cursor:pointer;border-radius:9999px}
 @keyframes trolleyPulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.footer{background:rgba(10,10,10,0.8);border-top:1px solid rgba(255,255,255,0.1);padding:40px 16px;margin-top:60px}
.footer-cols{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.footer-col h4{font-weight:900;font-size:13px;letter-spacing:0.1em;margin-bottom:12px;color:#FFD700}
.footer-col p, .footer-col a{font-size:12px;color:rgba(255,255,255,0.7);line-height:1.8}
.footer-col a{cursor:pointer;text-decoration:none}
.footer-col a:hover{color:#FFD700}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="top-line"></div>
<div class="header">
  <div class="header-inner">
    <div class="logo-wrap" onclick="location.href='/'">
      <div class="logo-circle">RM</div>
      <div>
        <div style="font-weight:900;letter-spacing:0.18em;font-size:14px;line-height:1">REGALIA STYLE MALL</div>
        <div style="font-size:10px;letter-spacing:0.3em;color:#FFD700;margin-top:2px">EST 2017</div>
      </div>
    <div style="margin-left:auto"><div id="cartIcon" style="position:relative;width:48px;height:48px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="openCartDrawer()"><span style="font-size:22px">🛒</span><span id="cartNum" style="position:absolute;top:-6px;right:-6px;background:#000;color:#FFD700;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center">0</span></div></div>
    </div>
  </div>
</div>

<div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px">
    <h1 style="font-size:22px;font-weight:900;letter-spacing:-0.02em">BUY <span style="color:#FFD700">— SHOP</span></h1>
  </div>
  <div class="grid" id="grid"></div>
  <div class="load-more"><button id="loadMore" class="load-more-btn">LOAD MORE</button></div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="document.getElementById('productModal').classList.remove('show')">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-cols">
    <div class="footer-col">
      <h4>REGALIA STYLE MALL</h4>
      <p>Luxury fashion & branding platform for African brands</p>
    </div>
    <div class="footer-col">
      <h4>QUICK LINKS</h4>
      <p><a onclick="location.href='/'">Home</a></p>
      <p><a onclick="location.href='/shop-auth.html'">Rent a Shop</a></p>
      <p><a onclick="location.href='/branding.html'">Branding Services</a></p>
    </div>
    <div class="footer-col">
      <h4>SUPPORT</h4>
      <p><a href="mailto:hello@regalia.store">ABDUL.KABIKA.BANT@GMAIL.COM</a></p>
      <p><a href="https://wa.me/27788327938" target="_blank">WhatsApp Support</a></p>
    </div>
  </div>
</div>

  <script>
const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=900&auto=format&fit=crop&q=80';
const fallbackProducts = [
{id:"p1",name:"Heritage Black Dad Cap",price:249,image:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=600&h=600&fit=crop",brand:"ANC",stock:20,colors:"Black,Gold",sizes:"OSFM,S/M,L/XL",category:"Caps"},
{id:"p2",name:"ANC Tri-Color Track Jacket",price:899,image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&h=600&fit=crop",brand:"ANC",stock:15,colors:"Black,Yellow,Green",sizes:"S,M,L,XL,2XL",category:"Jackets"},
{id:"p3",name:"Gold Emblem Heavy Hoodie",price:650,image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&h=600&fit=crop",brand:"CCC",stock:30,colors:"Black,Gold",sizes:"M,2XL,5XL",category:"Hoodies"}
];
let allProducts = [];
let displayed = 0;
const LOAD_COUNT = 9;
const CART_KEY = 'regalia_cart';
let selectedColor = '';
let selectedSize = '';
let selectedProduct = null;

function getCart(){ try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch{return[]} }
function saveCart(c){ localStorage.setItem(CART_KEY, JSON.stringify(c)) }
function updateCartBadge(){ const count=getCart().reduce((s,i)=>s+Number(i.qty||1),0); const b=document.getElementById('cartNum'); if(b) b.textContent=count; }
function toast(m){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#FFD700;padding:12px 20px;border-radius:9999px;z-index:9999;font-weight:700;font-size:12px';document.body.appendChild(t);} t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }

async function loadProducts(){
  try{
    const response = await fetch('/api/products');
    const data = await response.json();
    allProducts = Array.isArray(data) && data.length>0? data : fallbackProducts;
    renderProducts();
  }catch(error){
    allProducts = fallbackProducts;
    renderProducts();
  }
  updateCartBadge();
}

function renderProducts(){
  const grid = document.getElementById('grid');
  const newItems = allProducts.slice(displayed, displayed + LOAD_COUNT);
  displayed += newItems.length;
  newItems.forEach(product => {
    const card = document.createElement('div');
    card.className = 'card';
    const colors = (product.colors || '').split(',').map(x=>x.trim()).filter(Boolean);
    const isCaps = (product.category || '').toLowerCase().includes('cap');
    const sizes = isCaps? ['OSFM','S/M','L/XL'] : (product.sizes || '').split(',').map(x=>x.trim()).filter(Boolean);
    card.innerHTML = `<div class="card-img"><img src="${product.image || FALLBACK_IMAGE}" alt="${product.name}" /><div class="badge">${product.views || 0} views</div></div><div class="card-body"><div class="card-name">${product.brand || 'Brand'}</div><div class="card-price">R${Number(product.price || 0)}</div><div style="font-size:11px;color:#666;margin-top:4px">Stock: ${Number(product.stock || 0)}</div></div>`;
    card.addEventListener('click', () => showModal(product, colors, sizes, isCaps));
    grid.appendChild(card);
  });
  document.getElementById('loadMore').style.display = displayed >= allProducts.length? 'none' : 'block';
}

function showModal(product, colors, sizes, isCaps){
  const modal = document.getElementById('productModal');
  const body = document.getElementById('modalBody');
  const features = (product.features || '').split(/\n|\r/).map(x=>x.trim()).filter(Boolean);
  selectedProduct = product;
  selectedColor = colors[0] || '';
  selectedSize = sizes[0] || '';
  body.innerHTML = `<h2>${product.name}</h2><img src="${product.image || FALLBACK_IMAGE}" style="width:100%;height:250px;object-fit:cover;border-radius:12px;margin:16px 0;" /><div style="margin:16px 0;"><strong>Price:</strong> R${Number(product.price || 0)}<br><strong>Brand:</strong> ${product.brand || 'N/A'}<br><strong>Stock:</strong> ${Number(product.stock || 0)}<br>${product.description? `<div style="margin:16px 0;"><strong>Description:</strong><br>${product.description}</div>` : ''}${features.length? `<div style="margin:16px 0;"><strong>Features:</strong><ul>${features.map(f=>`<li>${f}</li>`).join('')}</ul></div>` : ''}<div style="margin:16px 0;"><strong>Colors:</strong><div id="colorPills" style="margin-top:6px">${colors.length? colors.map(c=>`<button class="color-pill ${c===selectedColor?'active':''}" data-c="${c}">${c}</button>`).join('') : 'Not available'}</div></div><div style="margin:16px 0;"><strong>Size:</strong><div id="sizePills" style="margin-top:6px">${sizes.length? sizes.map(s=>`<button class="size-pill ${s===selectedSize?'active':''}" data-s="${s}">${s}</button>`).join('') : 'Not available'}</div></div><div style="margin:16px 0;"><strong>Delivery:</strong> ${product.delivery_info || '5 working days before collection'}</div><div style="display:flex;gap:8px;align-items:center;margin-top:16px"><label>Qty:</label><input id="modalQty" type="number" class="qty-input" value="1" min="1" style="width:60px;padding:8px;border:1px solid #ccc;border-radius:8px" /><button id="modalAddBtn" style="flex:1;padding:10px;background:#FFD700;color:#000;border:none;font-weight:900;border-radius:8px;cursor:pointer">Add to Cart</button></div>`;
  modal.classList.add('show');
  body.querySelectorAll('.color-pill').forEach(b=>b.onclick=()=>{ selectedColor=b.dataset.c; body.querySelectorAll('.color-pill').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
 document.getElementById('modalAddBtn').onclick=function(){
 const qty=parseInt(document.getElementById('modalQty').value||'1')||1;
 const cart=getCart();
 const id=(product.id||product.name)+'-'+selectedColor+'-'+selectedSize;
 const ex=cart.findIndex(function(a){return a.id===id;});
 if(ex>=0){cart[ex].qty+=qty;}else{cart.push({id:id,name:product.name,price:product.price,image:product.image,color:selectedColor,size:selectedSize,qty:qty});}
 saveCart(cart); updateCartBadge(); openCartDrawer(true);
 toast('Added '+product.name);
};
function openCartDrawer(){var d=document.getElementById('cartDrawer'); if(d){d.style.right='0';} renderDrawer();}
function renderDrawer(){var c=getCart();var e=document.getElementById('drawerItems');if(!e)return;if(c.length==0){e.innerHTML='<p style="text-align:center">Empty</p>';return;}e.innerHTML=c.map(function(i){return '<div style="display:flex;gap:10px;margin-bottom:12px"><img src="'+i.image+'" style="width:50px;height:50px"><div>'+i.name+' x'+i.qty+'<br>R'+i.price+'</div></div>'}).join('');}
document.getElementById('loadMore').addEventListener('click', renderProducts);
loadProducts();
</script>
<div id="cartDrawer" style="position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;z-index:99999;transition:.4s;display:flex;flex-direction:column">
<div style="padding:16px;background:#000;color:#FFD700;display:flex;justify-content:space-between"><b>DRIP</b><span onclick="document.getElementById('cartDrawer').style.right='-420px'">X</span></div>
<div id="drawerItems" style="flex:1;padding:16px;overflow:auto"></div>
</div>
</body>
</html>
</script>
 <div id="cartDrawer" style="position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;z-index:99999;transition:.4s"></div>
</body>
</html>
