<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REGALIA STYLE - Mall</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{padding:15px;text-align:center;background:linear-gradient(90deg,#000,#4a3b00,#1a4d2e);border-bottom:3px solid gold;cursor:pointer}
#breadcrumb{padding:10px 20px;background:#222;color:gold}
#breadcrumb span{cursor:pointer;text-decoration:underline;margin:0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding:20px}
.card{background:#222;border:1px solid #444;padding:15px;text-align:center;cursor:pointer;border-radius:8px}
.card:hover{border-color:gold}
.card img{width:100%;height:160px;object-fit:contain;background:#fff;border-radius:4px}
.btn{padding:12px 18px;border:2px solid gold;background:#000;color:gold;font-weight:bold;cursor:pointer;margin:5px;border-radius:5px}
.btn.active,.btn:hover{background:gold;color:#000}
.shop-logo{width:80px;height:80px;border-radius:50%;background:#fff;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#000;font-weight:bold}
</style>
</head>
<body>
<header onclick="goHome()"><h1>REGALIA STYLE MALL</h1><p>Main Shop: Regalia | No rented shops yet</p></header>
<div id="breadcrumb">Home</div>
<div id="content" class="grid">Loading...</div>
<script src="app.js"></script>
</body>
</html>
