<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGALIA MALL | ANC REGALIA STYLE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC300;--black:#0B0B0B;--card:#151515;--border:#232323}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',Arial}
body{background:var(--black);color:#fff;min-height:100vh}
header{background:#000;border-bottom:1px solid var(--border);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.brand{display:flex;gap:10px;align-items:center}
.brand .dot{width:32px;height:32px;background:var(--gold);color:#000;border-radius:50%;display:grid;place-items:center;font-weight:800}
.brand h1{font-size:16px;letter-spacing:1px}
.brand h1 span{color:var(--gold)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:var(--card);border:1px solid var(--border);color:#aaa;padding:9px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.nav button.active,.nav button:hover{background:var(--gold);color:#000;border-color:var(--gold)}
#subbar{background:#101010;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;gap:8px;overflow-x:auto;align-items:center}
#subbar button{background:#1C1C1C;border:1px solid #2a2a2a;color:#bbb;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;white-space:nowrap}
#subbar button.active{background:#fff;color:#000}
#crumb{padding:10px 22px;color:#555;font-size:11px;letter-spacing:.5px}
#app{padding:18px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .img{height:200px;background:#fff;display:grid;place-items:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:contain}
.card .info{padding:12px}
.card .info h3{font-size:13px;line-height:1.3;height:34px;overflow:hidden}
.card .info .price{color:var(--gold);font-weight:800;margin-top:6px}
.shop-badge{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:#222;border-radius:12px;padding:3px 8px;font-size:10px;color:#aaa}
.hero{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.hero .hcard{flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer}
.hero .hcard h2{font-size:18px}
.hero .hcard p{color:#888;font-size:12px;margin-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:200;padding:20px}
.modal{background:#151515;border:1px solid #2a2a2a;border-radius:14px;max-width:900px;width:100%;overflow:hidden}
.shop-head{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #222;background:#111;cursor:pointer}
.shop-head .av{width:42px;height:42px;background:var(--gold);color:#000;border-radius:50%;display:grid;place-items:center;font-weight:800}
.btn{background:var(--gold);color:#000;border:0;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer}
.btn2{background:#222;color:#fff;border:1px solid #333;padding:11px 18px;border-radius:8px;cursor:pointer}
.form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:560px}
.form input,.form select,.form textarea{width:100%;padding:11px;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;border-radius:8px;margin:6px 0}
.size{display:inline-block;padding:8px 14px;border:1px solid #333;border-radius:20px;margin:4px;cursor:pointer;font-size:12px}
.size.active{background:var(--gold);color:#000;border-color:var(--gold)}
.success{text-align:center;padding:60px 20px}
.success h1{color:var(--gold);font-size:32px}
</style>
</head>
<body>
<header>
<div class="brand"><div class="dot">R</div><h1>REGALIA <span>MALL</span></h1></div>
<div class="nav">
<button onclick="router('BUY')" id="n-BUY" class="active">BUY</button>
<button onclick="router('RENT')" id="n-RENT">RENT SHOP</button>
<button onclick="router('BRANDING')" id="n-BRANDING">BRANDING</button>
<button onclick="router('PLAINS')" id="n-PLAINS">BUY PLAINS</button>
</div>
</header>
<div id="subbar"></div>
<div id="crumb">HOME / BUY</div>
<div id="app">Loading...</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modalInner"></div>
</div>
