<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANC Regalia Admin</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #141922;
        --panel-alt: #1b2330;
        --line: rgba(255,255,255,0.1);
        --text: #f3f5f8;
        --muted: #9ba8b6;
        --gold: #f4c95d;
        --gold-strong: #d7aa2d;
        --green: #1ecb8c;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b0d12, #101923);
        color: var(--text);
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-card {
        width: min(420px, 100%);
        background: rgba(20, 25, 34, 0.96);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px 22px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      }

      .login-card h1 {
        margin: 0 0 8px;
        font-size: clamp(1.7rem, 3vw, 2.3rem);
        letter-spacing: 0.04em;
      }

      .subhead {
        color: var(--muted);
        margin-bottom: 22px;
      }

      label {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 8px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--panel-alt);
        color: var(--text);
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 1rem;
      }

      textarea {
        resize: vertical;
        min-height: 96px;
      }

      .btn {
        width: 100%;
        margin-top: 18px;
        border: none;
        background: linear-gradient(135deg, var(--gold), var(--gold-strong));
        color: #111;
        font-weight: 700;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
      }

      .error {
        margin-top: 14px;
        min-height: 20px;
        color: var(--danger);
        font-size: 0.85rem;
      }

      .admin-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .logout-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .product-card {
        background: rgba(20, 25, 34, 0.95);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      .product-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        background: #0d1117;
      }

      .product-body {
        padding: 16px;
      }

      .product-body label {
        margin-top: 12px;
      }

      .product-body .inline-row {
        display: flex;
        gap: 10px;
      }

      .upload-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }

      .upload-row input[type='file'] {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.8rem;
      }

      .small-btn {
        border: 1px solid var(--line);
        background: var(--panel-alt);
        color: var(--text);
        border-radius: 8px;
        cursor: pointer;
        padding: 10px 12px;
        font-weight: 600;
      }

      .save-btn {
        width: 100%;
        margin-top: 18px;
        background: var(--green);
        border: none;
        color: #0d1a15;
        font-weight: 700;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
      }

      .status {
        margin-top: 8px;
        min-height: 20px;
        color: var(--gold);
        font-size: 0.82rem;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loginShell" class="login-shell">
      <div class="login-card">
        <h1>ANC REGALIA</h1>
        <div class="subhead">Store admin access</div>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" />
        <button id="loginBtn" class="btn">Enter admin</button>
        <div id="loginError" class="error"></div>
      </div>
    </div>

    <div id="adminShell" class="admin-shell hidden">
      <div class="topbar">
        <div class="brand">ANC REGALIA ADMIN</div>
        <button id="logoutBtn" class="logout-btn">Log out</button>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </div>

    <script>
      const ADMIN_PASSWORD = '12345';
      const loginShell = document.getElementById('loginShell');
      const adminShell = document.getElementById('adminShell');
      const passwordInput = document.getElementById('password');
      const loginError = document.getElementById('loginError');
      const productGrid = document.getElementById('productGrid');

      function showLogin() {
        loginShell.classList.remove('hidden');
        adminShell.classList.add('hidden');
      }

      function showAdmin() {
        loginShell.classList.add('hidden');
        adminShell.classList.remove('hidden');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function isAuthenticated() {
        return sessionStorage.getItem('regalia-admin-auth') === 'true';
      }

      async function login() {
        const value = passwordInput.value.trim();

        if (value !== ADMIN_PASSWORD) {
          loginError.textContent = 'Incorrect password.';
          return;
        }

        sessionStorage.setItem('regalia-admin-auth', 'true');
        loginError.textContent = '';
        await loadProducts();
        showAdmin();
      }

      function logout() {
        sessionStorage.removeItem('regalia-admin-auth');
        passwordInput.value = '';
        showLogin();
      }

      async function uploadImage(file) {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Image upload failed.');
        }

        return result.url;
      }

      function renderProducts(products) {
        productGrid.innerHTML = products.map((product) => {
          const imageValue = escapeHtml(product.image || '');
          const nameValue = escapeHtml(product.name || '');
          const categoryValue = escapeHtml(product.category || 'BUY');
          const brandValue = escapeHtml(product.brand || 'ANC Regalia');
          const stockValue = Number(product.stock || 0);
          const descriptionValue = escapeHtml(product.description || '');
          const featuresValue = escapeHtml(product.features || '');
          const colorsValue = escapeHtml(product.colors || '');
          const sizesValue = escapeHtml(product.sizes || '');
          const deliveryValue = escapeHtml(product.delivery_info || '4 working days before collection');
          const priceValue = Number(product.price || 0);
          const previewImage = imageValue || 'https://via.placeholder.com/600x600?text=No+Image';

          return `
            <div class="product-card">
              <img src="${previewImage}" alt="${nameValue}" data-preview="${product.id}" />
              <div class="product-body">
                <label>Product Name</label>
                <input data-field="name" value="${nameValue}" />

                <label>Price</label>
                <input type="number" step="0.01" data-field="price" value="${priceValue}" />

                <label>Category</label>
                <input data-field="category" value="${categoryValue}" />

                <label>Brand</label>
                <input data-field="brand" value="${brandValue}" />

                <label>Stock</label>
                <input type="number" data-field="stock" value="${stockValue}" />

                <label>Description</label>
                <textarea data-field="description" rows="3">${descriptionValue}</textarea>

                <label>Product Features</label>
                <textarea data-field="features" rows="3" placeholder="One feature per line">${featuresValue}</textarea>

                <label>Colors</label>
                <input data-field="colors" value="${colorsValue}" placeholder="e.g. Yellow, Green, Black" />

                <label>Sizes</label>
                <input data-field="sizes" value="${sizesValue}" placeholder="e.g. S, M, L, XL, XXL" />

                <label>Expected Delivery</label>
                <input data-field="delivery_info" value="${deliveryValue}" />

                <label>Image URL</label>
                <input data-field="image" value="${imageValue}" />

                <div class="upload-row">
                  <input type="file" accept="image/*" data-upload="${product.id}" />
                  <button class="small-btn" data-upload-btn="${product.id}">Upload</button>
                </div>

                <button class="save-btn" data-save="${product.id}">Save</button>
                <div class="status" data-status="${product.id}"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      async function loadProducts() {
        const response = await fetch('/api/products');
        const products = await response.json();

        if (!Array.isArray(products)) {
          productGrid.innerHTML = '<p>No products available.</p>';
          return;
        }

        renderProducts(products);
      }

      async function saveProduct(productId) {
        const card = document.querySelector(`.product-card [data-save="${productId}"]`)?.closest('.product-card');
        if (!card) return;

        const name = card.querySelector('[data-field="name"]').value.trim();
        const price = Number(card.querySelector('[data-field="price"]').value);
        const category = card.querySelector('[data-field="category"]').value.trim() || 'BUY';
        const brand = card.querySelector('[data-field="brand"]').value.trim() || 'ANC Regalia';
        const stock = Number(card.querySelector('[data-field="stock"]').value || 0);
        const description = card.querySelector('[data-field="description"]').value.trim();
        const features = card.querySelector('[data-field="features"]').value.trim();
        const colors = card.querySelector('[data-field="colors"]').value.trim();
        const sizes = card.querySelector('[data-field="sizes"]').value.trim();
        const deliveryInfo = card.querySelector('[data-field="delivery_info"]').value.trim() || '4 working days before collection';
        const image = card.querySelector('[data-field="image"]').value.trim() || 'https://via.placeholder.com/600x600?text=No+Image';
        const statusNode = card.querySelector('[data-status="' + productId + '"]');

        statusNode.textContent = 'Saving...';

        const response = await fetch('/api/products', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: productId,
            name,
            price,
            category,
            brand,
            stock,
            description,
            features,
            colors,
            sizes,
            delivery_info: deliveryInfo,
            image
          })
        });

        const result = await response.json();

        if (!response.ok) {
          statusNode.textContent = result.error || 'Could not save.';
          return;
        }

        const img = card.querySelector('img');
        if (result.image) img.src = result.image;

        statusNode.textContent = 'Saved successfully.';
        setTimeout(() => {
          statusNode.textContent = '';
        }, 1800);
      }

      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('logoutBtn').addEventListener('click', logout);
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') login();
      });

      document.addEventListener('click', async (event) => {
        const uploadButton = event.target.closest('[data-upload-btn]');
        const saveButton = event.target.closest('[data-save]');

        if (uploadButton) {
          const productId = Number(uploadButton.dataset.uploadBtn);
          const input = document.querySelector(`input[data-upload="${productId}"]`);
          const card = uploadButton.closest('.product-card');
          const statusNode = card.querySelector('[data-status="' + productId + '"]');

          if (!input || !input.files || input.files.length === 0) {
            statusNode.textContent = 'Choose a file first.';
            return;
          }

          statusNode.textContent = 'Uploading...';

          try {
            const uploadedUrl = await uploadImage(input.files[0]);
            const imageInput = card.querySelector('[data-field="image"]');
            imageInput.value = uploadedUrl;
            card.querySelector('img').src = uploadedUrl;
            statusNode.textContent = 'Image uploaded.';
          } catch (error) {
            statusNode.textContent = error.message || 'Upload failed.';
          }
        }

        if (saveButton) {
          const productId = Number(saveButton.dataset.save);
          await saveProduct(productId);
        }
      });

      if (isAuthenticated()) {
        showAdmin();
        loadProducts();
      } else {
        showLogin();
      }
    </script>
  </body>
</html>
