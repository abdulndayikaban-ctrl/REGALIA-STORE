<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Admin</title>
  <style>
    :root { --bg:#0b0d12; --panel:#141922; --line: rgba(255,255,255,0.12); --text:#f3f5f8; --muted:#9ba8b6; --gold:#f4c95d; --gold-strong:#d7aa2d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(180deg,#0b0d12,#101923); color:var(--text); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
    .panel { background: rgba(20,25,34,0.96); border:1px solid var(--line); border-radius:18px; padding:24px; }
    h1 { margin-top:0; }
    label { display:block; color:var(--muted); font-size:0.82rem; margin: 14px 0 8px; }
    input { width:100%; border:1px solid var(--line); background:#1b2330; color:var(--text); border-radius:10px; padding:12px 14px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .logo-box { display:flex; align-items:center; gap:16px; margin-top:16px; }
    .logo-preview { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-strong)); color:#111; display:flex; align-items:center; justify-content:center; font-weight:900; }
    button { margin-top:18px; width:100%; border:none; border-radius:10px; background:linear-gradient(135deg,var(--gold),var(--gold-strong)); color:#111; font-weight:900; padding:12px 18px; cursor:pointer; }
    .status { min-height: 20px; color: var(--gold); margin-top: 12px; }
  </style>
</head>
<body>
  <div id="shopLoginShell" class="wrap">
    <div class="panel">
      <h1>Shop Admin Login</h1>
      <label>Shop slug</label>
      <input id="shopSlugLogin" placeholder="Enter any shop slug" />
      <button id="shopLoginBtn">Open shop admin</button>
      <div id="shopLoginError" class="status" style="color: #ff6b6b;"></div>
    </div>
  </div>

  <div id="shopAdminShell" class="wrap hidden">
    <div class="panel">
      <h1>Shop Admin</h1>
      <div class="row">
        <div>
          <label>Shop Name</label>
          <input id="shopName" placeholder="ANC REGALIA STYLE" />
        </div>
        <div>
          <label>Slug</label>
          <input id="shopSlug" placeholder="anc-regalia-style" />
        </div>
      </div>
      <label>Owner Name</label>
      <input id="ownerName" placeholder="Abdul Divad Kabika" />
      <label>Logo URL</label>
      <input id="logoUrl" placeholder="https://example.com/logo.png" />
      <div class="logo-box">
        <div id="logoPreview" class="logo-preview">ANC</div>
        <input id="logoFile" type="file" accept="image/*" />
      </div>
      <button id="saveShopBtn">Save Shop Info</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'regalia_shop_profile';
    const SHOP_LOGIN_KEY = 'regalia_shop_slug';
    const defaultProfile = {
      shopName: 'ANC REGALIA STYLE',
      shopSlug: 'anc-regalia-style',
      ownerName: 'Abdul Divad Kabika',
      logoUrl: ''
    };

    function readProfile() {
      try {
        return { ...defaultProfile, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') };
      } catch (error) {
        return { ...defaultProfile };
      }
    }

    function saveProfile(profile) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    }

    function updatePreview() {
      const name = document.getElementById('shopName').value.trim() || 'ANC';
      const logo = document.getElementById('logoUrl').value.trim();
      const preview = document.getElementById('logoPreview');
      preview.textContent = logo ? 'IMG' : name.slice(0, 3).toUpperCase();
    }

    function applyProfile() {
      const profile = readProfile();
      document.getElementById('shopName').value = profile.shopName;
      document.getElementById('shopSlug').value = profile.shopSlug;
      document.getElementById('ownerName').value = profile.ownerName;
      document.getElementById('logoUrl').value = profile.logoUrl || '';
      updatePreview();
    }

    function openShopAdmin(slug) {
      const normalizedSlug = String(slug || '').trim();
      if (!normalizedSlug) {
        document.getElementById('shopLoginError').textContent = 'Please enter a shop slug.';
        return;
      }

      localStorage.setItem(SHOP_LOGIN_KEY, normalizedSlug);
      document.getElementById('shopLoginShell').classList.add('hidden');
      document.getElementById('shopAdminShell').classList.remove('hidden');
      document.getElementById('shopSlug').value = normalizedSlug;
      document.getElementById('shopLoginError').textContent = '';
    }

    document.getElementById('shopLoginBtn').addEventListener('click', () => {
      openShopAdmin(document.getElementById('shopSlugLogin').value);
    });

    document.getElementById('shopName').addEventListener('input', updatePreview);
    document.getElementById('logoUrl').addEventListener('input', updatePreview);

    document.getElementById('logoFile').addEventListener('change', async (event) => {
      const [file] = event.target.files || [];
      if (!file) return;
      const url = URL.createObjectURL(file);
      document.getElementById('logoUrl').value = url;
      updatePreview();
    });

    document.getElementById('saveShopBtn').addEventListener('click', () => {
      const profile = {
        shopName: document.getElementById('shopName').value.trim() || defaultProfile.shopName,
        shopSlug: document.getElementById('shopSlug').value.trim() || defaultProfile.shopSlug,
        ownerName: document.getElementById('ownerName').value.trim() || defaultProfile.ownerName,
        logoUrl: document.getElementById('logoUrl').value.trim()
      };
      saveProfile(profile);
      document.getElementById('status').textContent = 'Shop profile saved.';
    });

    const storedSlug = localStorage.getItem(SHOP_LOGIN_KEY);
    if (storedSlug) {
      openShopAdmin(storedSlug);
    }

    applyProfile();
  </script>
</body>
</html>
